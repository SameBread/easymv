[package]
name = "easymv-engine"
version = "0.6.0"
edition = "2021"
description = "EasyMV audio analysis + routing engine (Rust/WASM)"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
symphonia = { version = "0.6", default-features = false, features = ["wav", "flac", "mp3", "aac", "isomp4", "ogg", "vorbis", "pcm"] }
rubato = "5"
realfft = "3.5"
gif = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
